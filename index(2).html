<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>班级请假管理系统（联网共享版）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1f2430;font-size:15px;}
  .hidden{display:none!important;}
  .page{padding:16px 14px 80px;}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px;}
  h1{font-size:22px;text-align:center;margin:6px 0 4px;color:#2f5fd0;}
  h2{font-size:17px;margin:0 0 12px;color:#2f5fd0;}
  .sub{text-align:center;color:#9aa1ad;font-size:13px;margin-bottom:18px;}
  label{display:block;font-size:13px;color:#5b6472;margin:10px 0 5px;}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dfe3ea;border-radius:10px;font-size:15px;background:#fbfcfe;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:#2f5fd0;}
  textarea{resize:vertical;min-height:80px;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  button{cursor:pointer;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;transition:.15s;}
  .btn-primary{background:#2f5fd0;color:#fff;width:100%;margin-top:14px;}
  .btn-primary:active{transform:scale(.98);}
  .btn-sm{background:#eef2fb;color:#2f5fd0;padding:8px 14px;font-size:13px;width:auto;}
  .btn-green{background:#16a34a;color:#fff;}
  .btn-red{background:#e5484d;color:#fff;}
  .btn-ghost{background:#f0f2f5;color:#5b6472;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
  .tab{flex:1;min-width:72px;text-align:center;padding:9px 6px;background:#fff;border-radius:10px;font-size:13px;color:#5b6472;border:1px solid #e5e9f0;white-space:nowrap;}
  .tab.active{background:#2f5fd0;color:#fff;border-color:#2f5fd0;}
  .item{border:1px solid #eef0f4;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;}
  .item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .item .nm{font-weight:700;font-size:15px;}
  .item .meta{font-size:12px;color:#8b93a1;line-height:1.7;}
  .item .reason{margin:6px 0;font-size:14px;}
  .item .acts{display:flex;gap:8px;margin-top:8px;}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;}
  .b-pending{background:#fff4e5;color:#d98304;}
  .b-approved{background:#e3f7ea;color:#16a34a;}
  .b-rejected{background:#fde8e9;color:#e5484d;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e5e9f0;padding:6px 0 calc(6px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:#8b93a1;}
  .nav-item.active{color:#2f5fd0;font-weight:700;}
  .header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .who{font-size:13px;color:#5b6472;}
  .who b{color:#2f5fd0;}
  .empty{text-align:center;color:#9aa1ad;padding:30px 0;}
  .hint{font-size:12px;color:#9aa1ad;line-height:1.6;margin-top:8px;}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:99;}
  .net-ok{color:#16a34a;} .net-bad{color:#e5484d;}
  .pwd-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .pwd-modal .card{width:100%;max-width:340px;margin:0;}
  .config-bar{background:#fff4e5;border:1px solid #f3ddb5;border-radius:10px;padding:10px 12px;font-size:12px;color:#8a5a00;margin-bottom:14px;}
</style>
</head>
<body>

<!-- ================= Supabase 官方客户端 ================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ================= 部署配置（必填，见 config.js） ================= -->
<script src="./config.js"></script>

<!-- ================= 登录页 ================= -->
<div id="pageLogin" class="page">
  <h1>📋 班级请假管理系统</h1>
  <p class="sub">联网共享版 · 多设备数据实时同步</p>
  <div id="netBox" class="config-bar hidden"></div>
  <div class="card">
    <div id="netStatus" class="hint" style="text-align:center;margin-bottom:12px;"></div>
    <label>姓名</label>
    <input id="loginName" placeholder="请输入姓名" autocomplete="off">
    <label>密码</label>
    <input id="loginPwd" type="password" placeholder="初始密码 123456">
    <button class="btn-primary" onclick="doLogin()">登 录</button>
    <p class="hint">首次使用请用演示账号登录，之后可改密码。<br>账号：李丽娜 / 丁瑞龙 / 王海硕 / 张三 等，密码统一 123456</p>
  </div>
</div>

<!-- ================= 学生端 ================= -->
<div id="pageStudent" class="page hidden">
  <div class="header-bar"><div class="who">👤 <b id="stWho"></b> · <span id="stClass"></span></div>
    <button class="btn-sm btn-ghost" onclick="showLogin()">退出</button></div>
  <div class="tabs">
    <div class="tab active" onclick="stTab('apply',this)">我要请假</div>
    <div class="tab" onclick="stTab('list',this)">我的记录</div>
    <div class="tab" onclick="stTab('info',this)">我的信息</div>
  </div>
  <div id="stApply">
    <div class="card">
      <h2>提交请假申请</h2>
      <label>离校时间</label>
      <input type="datetime-local" id="stStart">
      <label>回校时间（标注项）</label>
      <input type="datetime-local" id="stEnd">
      <label>请假事由</label>
      <textarea id="stReason" placeholder="如：回家、看病、外出办事…"></textarea>
      <button class="btn-primary btn-green" onclick="submitLeave()">提交申请</button>
    </div>
  </div>
  <div id="stList" class="hidden"></div>
  <div id="stInfo" class="hidden"></div>
  <div class="bottom-nav"><div class="nav-item active">同学端</div></div>
</div>

<!-- ================= 班长端 ================= -->
<div id="pageMonitor" class="page hidden">
  <div class="header-bar"><div class="who">🧑‍🏫 班长：<b id="mnWho"></b> · <span id="mnClass"></span></div>
    <button class="btn-sm btn-ghost" onclick="showLogin()">退出</button></div>
  <div class="tabs">
    <div class="tab active" onclick="mnTab('apply',this)">我要请假</div>
    <div class="tab" onclick="mnTab('list',this)">本班申请</div>
    <div class="tab" onclick="mnTab('users',this)">账号密码</div>
    <div class="tab" onclick="mnTab('add',this)">导入同学</div>
  </div>
  <div id="mnApply">
    <div class="card">
      <h2>班长请假</h2>
      <label>离校时间</label><input type="datetime-local" id="mnStart">
      <label>回校时间</label><input type="datetime-local" id="mnEnd">
      <label>请假事由</label><textarea id="mnReason" placeholder="班长请假由导员审批"></textarea>
      <button class="btn-primary btn-green" onclick="submitLeaveMn()">提交申请</button>
    </div>
    <div id="mnMyList"></div>
  </div>
  <div id="mnList" class="hidden"></div>
  <div id="mnUsers" class="hidden"></div>
  <div id="mnAdd" class="hidden">
    <div class="card">
      <h2>批量导入本班同学</h2>
      <label>本班名称</label><input id="addClass" placeholder="如 26药学班">
      <label>同学名单（一行一个，格式：姓名,密码）</label>
      <textarea id="addList" style="height:140px" placeholder="张三,123456&#10;李四,123456"></textarea>
      <button class="btn-primary" onclick="batchImport()">导入</button>
      <p class="hint">导入后同学立即可用姓名+密码登录。重复姓名会自动更新密码。</p>
    </div>
  </div>
  <div class="bottom-nav"><div class="nav-item active">班长端</div></div>
</div>

<!-- ================= 导员端 ================= -->
<div id="pageTeacher" class="page hidden">
  <div class="header-bar"><div class="who">👨‍🏫 导员：<b id="tcWho"></b></div>
    <button class="btn-sm btn-ghost" onclick="showLogin()">退出</button></div>
  <div class="tabs">
    <div class="tab active" onclick="tcTab('pending',this)">待审批</div>
    <div class="tab" onclick="tcTab('all',this)">全部记录</div>
    <div class="tab" onclick="tcTab('users',this)">账号密码</div>
  </div>
  <div id="tcPending"></div>
  <div id="tcAll" class="hidden"></div>
  <div id="tcUsers" class="hidden"></div>
  <div class="bottom-nav"><div class="nav-item active">导员端</div></div>
</div>

<!-- 改密码弹窗 -->
<div id="pwdModal" class="pwd-modal hidden" onclick="if(event.target===this)closeChangePwd()">
  <div class="card">
    <h2>修改密码</h2>
    <label>原密码</label><input type="password" id="oldPwd">
    <label>新密码</label><input type="password" id="newPwd">
    <label>确认新密码</label><input type="password" id="newPwd2">
    <button class="btn-primary btn-green" onclick="doChangePwd()">确认修改</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeChangePwd()">取消</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
/* ================= 数据模型 =================
   云端两张表（Supabase）：
     users(name, pwd, role, class_name)  主键 name
     leaves(id, student, class_name, reason, start_time, end_time,
            status, approver, decided_at, created_at)
   本地仅缓存 users 作为离线兜底。 */
let curUser = null;
let sb = null;                 // supabase 客户端
let netOK = false;             // 当前网络是否可达

/* ---------- 初始化 Supabase 客户端 ---------- */
function initSupabase(){
  if(!window.supabase){ netBad('无法加载 Supabase 脚本，请检查网络'); return false; }
  if(!SUPABASE_URL || SUPABASE_URL.indexOf('___') === 0){
    netBad('尚未配置：请打开本文件顶部，把 SUPABASE_URL / SUPABASE_ANON_KEY 换成你自己的项目信息（见部署教程）。');
    return false;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }catch(e){ netBad('客户端初始化失败：'+e.message); return false; }
}

/* ---------- 网络状态提示 ---------- */
function netBad(msg){ netOK=false; const b=document.getElementById('netBox'); b.classList.remove('hidden'); b.innerHTML=msg; document.getElementById('netStatus').innerHTML=''; }
function netGood(){ netOK=true; document.getElementById('netBox').classList.add('hidden'); document.getElementById('netStatus').innerHTML='<span class="net-ok">● 已连接云端，多设备共享中</span>'; }

/* ---------- 云端 CRUD 封装 ---------- */
async function apiAllUsers(){
  const { data, error } = await sb.from('users').select('*');
  if(error) throw error;
  return data || [];
}
async function apiUpsertUser(u){
  const { error } = await sb.from('users').upsert(u, { onConflict:'name' });
  if(error) throw error;
}
async function apiDeleteUser(name){
  await sb.from('users').delete().eq('name', name);
}
async function apiAllLeaves(){
  const { data, error } = await sb.from('leaves').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  return data || [];
}
async function apiInsertLeave(L){
  const { data, error } = await sb.from('leaves').insert(L).select().single();
  if(error) throw error;
  return data;
}
async function apiUpdateLeave(id, patch){
  const { error } = await sb.from('leaves').update(patch).eq('id', id);
  if(error) throw error;
}
// 兼容旧调用名
const apiSaveUsers = apiUpsertUser;

/* ============ 加载 / 同步 ============ */
async function loadUsers(){
  try{
    const list = await apiAllUsers();
    if(list && list.length){
      DB.users = {};
      list.forEach(u => { DB.users[u.name] = u; });
      try{ localStorage.setItem('leave_users_cache', JSON.stringify(DB.users)); }catch(e){}
      netGood();
    }else{
      DB.users = {};
      netGood();
    }
  }catch(e){
    console.warn('云端读取失败，使用本地缓存', e);
    document.getElementById('netStatus').innerHTML='<span class="net-bad">● 云端不可用，当前为离线模式（数据仅本机可见）</span>';
    try{ DB.users = JSON.parse(localStorage.getItem('leave_users_cache')||'{}'); }catch(e){ DB.users={}; }
  }
}

async function saveUser(u){
  DB.users[u.name] = u;
  try{ localStorage.setItem('leave_users_cache', JSON.stringify(DB.users)); }catch(e){}
  if(netOK){ try{ await apiUpsertUser(u); }catch(e){ console.error('sync fail', e); } }
}

async function deleteUserCloud(name){
  delete DB.users[name];
  try{ localStorage.setItem('leave_users_cache', JSON.stringify(DB.users)); }catch(e){}
  if(netOK){ try{ await apiDeleteUser(name); }catch(e){} }
}

let DB = { classes:{}, users:{}, leaves:[] };
/* classes: { className: { students:[{name,pwd}], monitor:{name,pwd}, teacher:{name,pwd} } }
   users 来自云端 users 表，本地只做缓存 */

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),1800); }

/* ============ 初始化演示数据 ============ */
async function initDemo(){
  if(Object.keys(DB.users).length > 0) return;
  // 26药学班：班长丁瑞龙
  const c1 = '26药学班';
  DB.classes[c1] = {
    students:[ {name:'张三',pwd:'123456'}, {name:'李四',pwd:'123456'}, {name:'王五',pwd:'123456'} ],
    monitor:{name:'丁瑞龙',pwd:'123456'},
    teacher:{name:'李丽娜',pwd:'123456'}
  };
  // 26中制班：班长王海硕
  const c2 = '26中制班';
  DB.classes[c2] = {
    students:[ {name:'赵六',pwd:'123456'}, {name:'孙七',pwd:'123456'}, {name:'周八',pwd:'123456'} ],
    monitor:{name:'王海硕',pwd:'123456'},
    teacher:{name:'李丽娜',pwd:'123456'}
  };
  DB.teacher = {name:'李丽娜', pwd:'123456'};
  const all = [];
  DB.classes[c1].students.forEach(s=> all.push({name:s.name,pwd:s.pwd,role:'student',className:c1}));
  DB.classes[c2].students.forEach(s=> all.push({name:s.name,pwd:s.pwd,role:'student',className:c2}));
  all.push({name:'丁瑞龙',pwd:'123456',role:'monitor',className:c1});
  all.push({name:'王海硕',pwd:'123456',role:'monitor',className:c2});
  all.push({name:'李丽娜',pwd:'123456',role:'teacher',className:''});
  // 先写云端，失败则只放内存
  for(const u of all){
    DB.users[u.name] = u;
    if(netOK){ try{ await apiUpsertUser(u); }catch(e){ console.error(e); } }
  }
  try{ localStorage.setItem('leave_users_cache', JSON.stringify(DB.users)); }catch(e){}
}

/* ============ 登录 ============ */
async function doLogin(){
  const name=document.getElementById('loginName').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!name){ toast('请输入姓名'); return; }
  if(!netOK){ toast('云端不可用，无法登录'); return; }
  let list = [];
  try{ list = await apiAllUsers(); }catch(e){ toast('无法连接服务器，请检查网络'); return; }
  const u = list.find(x => x.name === name);
  if(!u){ toast('该账号不存在，请联系班长导入名单'); return; }
  if(u.pwd!==pwd){ toast('密码错误'); return; }
  curUser={name, role:u.role, className:u.className};
  document.getElementById('loginName').value='';
  document.getElementById('loginPwd').value='';
  showPage(u.role);
}

function showPage(role){
  ['pageLogin','pageStudent','pageMonitor','pageTeacher'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  if(role==='student'){
    document.getElementById('pageStudent').classList.remove('hidden');
    document.getElementById('stWho').textContent=curUser.name;
    document.getElementById('stClass').textContent=curUser.className||'';
    renderMyInfo();
    stTab('apply',document.querySelector('#pageStudent .tab'));
  }else if(role==='monitor'){
    document.getElementById('pageMonitor').classList.remove('hidden');
    document.getElementById('mnWho').textContent=curUser.name;
    document.getElementById('mnClass').textContent=curUser.className||'';
    document.getElementById('addClass').value=curUser.className||'';
    mnTab('apply',document.querySelector('#pageMonitor .tab'));
  }else{
    document.getElementById('pageTeacher').classList.remove('hidden');
    document.getElementById('tcWho').textContent=curUser.name;
    tcTab('pending',document.querySelector('#pageTeacher .tab'));
  }
}

function doLogout(){ curUser=null; showLogin(); }

function showLogin(){
  curUser=null;
  ['pageStudent','pageMonitor','pageTeacher'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('pageLogin').classList.remove('hidden');
}

/* ============ 学生端 ============ */
function renderMyInfo(){
  document.getElementById('stInfo').innerHTML =
    `<div class="card"><h2>我的信息</h2>
      <p>姓名：<b>${curUser.name}</b></p><p>班级：${curUser.className||'—'}</p>
      <button class="btn-primary" onclick="openChangePwd()">修改密码</button>
      <p class="hint">改密码后会自动同步到云端，导员和班长看到的名单也会实时更新。</p></div>`;
}
async function submitLeave(){
  const start=document.getElementById('stStart').value, end=document.getElementById('stEnd').value;
  const reason=document.getElementById('stReason').value.trim();
  if(!start||!end){ toast('请选择离校和回校时间'); return; }
  if(new Date(end)<new Date(start)){ toast('回校时间必须晚于离校时间'); return; }
  if(!reason){ toast('请填写请假事由'); return; }
  if(!netOK){ toast('当前离线，无法提交'); return; }
  try{
    await apiInsertLeave({ student:curUser.name, class_name:curUser.className||'',
      reason, start_time:new Date(start).toISOString(), end_time:new Date(end).toISOString(),
      status:'pending' });
    document.getElementById('stReason').value='';
    toast('提交成功，等待导员审批');
    stTab('list',document.querySelector('#pageStudent .tab'));
  }catch(e){ toast('提交失败：'+e.message); }
}
async function renderMyList(){
  const box=document.getElementById('stList');
  let list=[];
  if(netOK){ try{ list = await apiAllLeaves(); }catch(e){} }
  const mine = list.filter(l=>l.student===curUser.name);
  if(!mine.length){ box.innerHTML='<div class="empty">还没有请假记录</div>'; return; }
  box.innerHTML = mine.map(l=>{
    const st = l.status==='approved'?'<span class="badge b-approved">已批准</span>'
      : l.status==='rejected'?'<span class="badge b-rejected">已驳回</span>'
      : '<span class="badge b-pending">待审批</span>';
    return `<div class="item"><div class="top"><span class="nm">${l.reason||'请假'}</span>${st}</div>
      <div class="meta">🕐 ${fmt(l.start_time)} → ${fmt(l.end_time)}<br>提交：${fmt(l.created_at)}</div>
      ${l.approver?`<div class="meta">审批人：${l.approver} · ${l.decided_at?fmt(l.decided_at):''}</div>`:''}</div>`;
  }).join('');
}
function stTab(which,el){
  ['stApply','stList','stInfo'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('#pageStudent .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(which==='apply') document.getElementById('stApply').classList.remove('hidden');
  if(which==='list'){ document.getElementById('stList').classList.remove('hidden'); renderMyList(); }
  if(which==='info'){ document.getElementById('stInfo').classList.remove('hidden'); renderMyInfo(); }
}
function fmt(s){ if(!s) return ''; const d=new Date(s); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ============ 班长端 ============ */
async function submitLeaveMn(){
  const start=document.getElementById('mnStart').value, end=document.getElementById('mnEnd').value;
  const reason=document.getElementById('mnReason').value.trim();
  if(!start||!end){ toast('请选择离校和回校时间'); return; }
  if(new Date(end)<new Date(start)){ toast('回校时间必须晚于离校时间'); return; }
  if(!reason){ toast('请填写请假事由'); return; }
  if(!netOK){ toast('当前离线，无法提交'); return; }
  try{
    await apiInsertLeave({ student:curUser.name, class_name:curUser.className||'',
      reason, start_time:new Date(start).toISOString(), end_time:new Date(end).toISOString(),
      status:'pending' });
    document.getElementById('mnReason').value='';
    toast('提交成功，等待导员审批');
    renderMnMy();
  }catch(e){ toast('提交失败：'+e.message); }
}
async function renderMnMy(){
  const box=document.getElementById('mnMyList');
  let list=[];
  if(netOK){ try{ list = await apiAllLeaves(); }catch(e){} }
  const mine = list.filter(l=>l.student===curUser.name);
  if(!mine.length){ box.innerHTML=''; return; }
  box.innerHTML = '<h2 style="font-size:15px">我的请假记录</h2>' + mine.map(l=>{
    const st = l.status==='approved'?'<span class="badge b-approved">已批准</span>'

}

async function addStudent(){
  const name=document.getElementById('addName').value.trim();
  const pwd=document.getElementById('addPwd').value.trim()||'123456';
  const cls=document.getElementById('addClass').value.trim()||curUser.className;
  if(!name){ toast('请输入同学姓名'); return; }
  if(DB.users[name]){ toast('该姓名已存在，请直接改密码'); return; }
  await saveUser({name, pwd, role:'student', className:cls});
  if(!DB.classes[cls]) DB.classes[cls]={students:[],monitor:{},teacher:{}};
  if(!DB.classes[cls].students.find(s=>s.name===name)) DB.classes[cls].students.push({name,pwd});
  document.getElementById('addName').value='';
  document.getElementById('addPwd').value='';
  toast('已添加：'+name+'（密码 '+pwd+'）');
  renderMonitorUsers();
  mnTab('users',document.querySelector('#pageMonitor .tabs .tab:nth-child(3)'));
}
async function batchImport(){
  const cls=document.getElementById('addClass').value.trim()||curUser.className;
  const text=document.getElementById('addList').value.trim();
  if(!cls){ toast('请填写班级名称'); return; }
  if(!text){ toast('请填写名单'); return; }
  if(!DB.classes[cls]) DB.classes[cls]={students:[],monitor:{},teacher:{}};
  const lines=text.split(/\n+/);
  let n=0;
  for(const line of lines){
    const p=line.split(/[,\t，]/).map(x=>x.trim()).filter(Boolean);
    if(!p[0]) continue;
    const name=p[0], pwd=p[1]||'123456';
    DB.users[name]={name,pwd,role:'student',className:cls};
    if(!DB.classes[cls].students.find(s=>s.name===name)) DB.classes[cls].students.push({name,pwd});
    if(netOK){ try{ await apiUpsertUser(DB.users[name]); }catch(e){} }
    n++;
  }
  try{ localStorage.setItem('leave_users_cache', JSON.stringify(DB.users)); }catch(e){}
  document.getElementById('addList').value='';
  toast('已导入 '+n+' 位同学');
  renderMonitorUsers();
  mnTab('users',document.querySelector('#pageMonitor .tabs .tab:nth-child(3)'));
}
function mnTab(which,el){
  ['mnApply','mnList','mnUsers','mnAdd'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('#pageMonitor .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(which==='apply'){ document.getElementById('mnApply').classList.remove('hidden'); renderMnMy(); }
  if(which==='list'){ document.getElementById('mnList').classList.remove('hidden'); renderMonitorList(); }
  if(which==='users'){ document.getElementById('mnUsers').classList.remove('hidden'); renderMonitorUsers(); }
  if(which==='add'){ document.getElementById('mnAdd').classList.remove('hidden'); }
}

async function decide(id,action){
  if(!netOK){ toast('当前离线，无法审批'); return; }
  try{
    await apiUpdateLeave(id, { status:action, approver:curUser.name, decided_at:new Date().toISOString() });
    toast(action==='approved'?'已批准':'已驳回');
    renderTeacherPending(); renderTeacherAll();
  }catch(e){ toast('操作失败：'+e.message); }
}
function tcTab(which,el){
  ['tcPending','tcAll','tcUsers'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('#pageTeacher .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(which==='pending'){ document.getElementById('tcPending').classList.remove('hidden'); renderTeacherPending(); }
  if(which==='all'){ document.getElementById('tcAll').classList.remove('hidden'); renderTeacherAll(); }
  if(which==='users'){ document.getElementById('tcUsers').classList.remove('hidden'); renderTeacherUsers(); }
}

/* ============ 改密码 ============ */
function openChangePwd(){ document.getElementById('pwdModal').classList.remove('hidden'); }
function closeChangePwd(){ document.getElementById('pwdModal').classList.add('hidden');
  ['oldPwd','newPwd','newPwd2'].forEach(id=>document.getElementById(id).value=''); }
async function doChangePwd(){
  const oldP=document.getElementById('oldPwd').value, newP=document.getElementById('newPwd').value, newP2=document.getElementById('newPwd2').value;
  if(!oldP||!newP){ toast('请填写完整'); return; }
  if(DB.users[curUser.name].pwd!==oldP){ toast('原密码错误'); return; }
  if(newP.length<4){ toast('新密码至少4位'); return; }
  if(newP!==newP2){ toast('两次输入不一致'); return; }
  await saveUser({name:curUser.name, pwd:newP, role:curUser.role, className:curUser.className||''});
  // 同步到 classes 副本（若有）
  Object.keys(DB.classes).forEach(c=>{
    const arr=DB.classes[c].students; if(arr) arr.forEach(s=>{ if(s.name===curUser.name) s.pwd=newP; });
    if(DB.classes[c].monitor&&DB.classes[c].monitor.name===curUser.name) DB.classes[c].monitor.pwd=newP;
    if(DB.classes[c].teacher&&DB.classes[c].teacher.name===curUser.name) DB.classes[c].teacher.pwd=newP;
  });
  closeChangePwd(); toast('密码已修改并同步');
  if(curUser.role==='student') renderMyInfo();
}

/* ============ 启动 ============ */
async function boot(){
  if(!initSupabase()) return;
  // 先本地兜底，再云端拉新
  try{ DB.users = JSON.parse(localStorage.getItem('leave_users_cache')||'{}'); }catch(e){ DB.users={}; }
  await loadUsers();        // 从云端取真实名单
  await initDemo();         // 首次无数据时写入演示账号
  if(!netOK) netGood();     // 兜底：演示数据写入成功也算通
}
boot();
